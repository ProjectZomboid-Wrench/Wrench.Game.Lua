# Corrections and additions merged over pz-lua-stubdata by tools/GenerateLuaClasses.cs. Same format; only classes
# the data already has are touched, except that new umbrella.* table shapes may be added. csName (Wrench's own key)
# renames a class in C#. Worth sending upstream where they're data errors rather than Wrench needs.
version: "1.1"
languages:
  lua:
    classes:
      # Strings in defines.lua (they double as settings-screen text), but they feed SandboxOptions' doubles;
      # typed as numbers, reads parse them.
      ZombiePopulationMultiplier:
        staticFields:
          Insane:
            type: number
          VeryHigh:
            type: number
          High:
            type: number
          Normal:
            type: number
          Low:
            type: number
          None:
            type: number
      ZombiePopulationStartMultiplier:
        staticFields:
          Insane:
            type: number
          VeryHigh:
            type: number
          High:
            type: number
          Normal:
            type: number
          Low:
            type: number
          None:
            type: number
      ZombiePopulationPeakMultiplier:
        staticFields:
          Insane:
            type: number
          VeryHigh:
            type: number
          High:
            type: number
          Normal:
            type: number
          Low:
            type: number
          None:
            type: number
      # The table a challenge registers with addChallenge (client/Challenge/*.lua).
      umbrella.LastStandChallenge.BaseChallenge:
        csName: ZomboidBaseChallenge
        fields:
          completionText:
            type: string
            nullable: true
          world:
            type: string
            notes: The map the challenge plays on, e.g. "Muldraugh, KY".
          spawns:
            type: umbrella.LastStandChallenge.Spawn[]
            nullable: true
            notes: Where players may start; one is picked at random.
      umbrella.LastStandChallenge.Challenge:
        csName: ZomboidChallenge
      umbrella.LastStandChallenge.Spawn:
        csName: ZomboidChallengeSpawn
        notes: Named in Umbrella's style, but the shape itself is Wrench's addition (tools/luaclasses/overlay.yml).
        fields:
          x:
            type: integer
          y:
            type: integer
          z:
            type: integer
      ISBaseTimedAction:
        fields:
          # Vanilla actions take any character (zombies and animals run some), not only players.
          character:
            type: IsoGameCharacter
        constructors:
          - parameters:
              - name: character
                type: IsoGameCharacter
        methods:
          # The base returns nothing, which LuaTimedActionNew reads as false; every real action returns a boolean.
          - name: isValid
            return:
              - type: boolean
          # Not defined on the base, but B42's LuaTimedActionNew calls it after perform (on the server in multiplayer).
          - name: complete
            return:
              - type: boolean
      # Java's UIElement reads a true result as "handled", so the mouse handlers return booleans where it matters.
      ISUIElement:
        methods:
          - name: onMouseUp
            return: [{ type: boolean, nullable: true }]
          - name: onMouseUpOutside
            return: [{ type: boolean, nullable: true }]
          - name: onMouseDownOutside
            return: [{ type: boolean, nullable: true }]
          - name: onMouseMove
            return: [{ type: boolean, nullable: true }]
          - name: onMouseMoveOutside
            return: [{ type: boolean, nullable: true }]
          - name: onRightMouseDown
            return: [{ type: boolean, nullable: true }]
          - name: onRightMouseUp
            return: [{ type: boolean, nullable: true }]
      ISPanelJoypad:
        methods:
          - name: onMouseDown
            return: [{ type: boolean, nullable: true }]
      CGlobalObjectSystem:
        methods:
          - name: isValidIsoObject
            return: [{ type: boolean }]
      SGlobalObjectSystem:
        methods:
          - name: isValidIsoObject
            return: [{ type: boolean }]
      ISPickCharacterCursor:
        methods:
          - name: isValidCharacter
            return: [{ type: boolean }]
